spring:
  datasource:
    url: jdbc:postgresql://db:5432/afdesign
    username: app
    password: app
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  main:
    banner-mode: "off"

server:
  port: 8080

