services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: afdesign
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      

  backend:
    build: ./backend
    depends_on:
      - db
    ports:
      - "8080:8080"
    env_file:
    - ./.env

  pgadmin:
    image: dpage/pgadmin4
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"

volumes:
  db_data:
